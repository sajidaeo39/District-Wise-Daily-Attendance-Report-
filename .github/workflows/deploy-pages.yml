name: Deploy Punjab Attendance Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate published attendance data
        run: |
          python - <<'PY'
          import json, os
          path = "data/punjab_attendance.json"
          assert os.path.isfile(path) and os.path.getsize(path) > 10, "Attendance JSON is missing or empty"
          data = json.load(open(path, encoding="utf-8"))
          assert isinstance(data.get("districts"), list), "District data is missing"
          print("Dashboard data file present; districts:", len(data["districts"]))
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
