name: Update Punjab District Attendance

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/punjab_attendance.json"
      - "README.md"
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
      timezone: "Asia/Karachi"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Collect live SIS attendance
        id: collector
        continue-on-error: true
        run: python punjab_district_collector.py

      - name: Commit latest real SIS data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/punjab_attendance.json
          if git diff --cached --quiet; then
            echo "No data file changes to commit."
          else
            git commit -m "Update Punjab district attendance data"
            git push
          fi

      - name: Fail if SIS collection was incomplete
        if: steps.collector.outcome == 'failure'
        run: |
          echo "SIS collection reported an error/incomplete collection."
          echo "Real successful records and failure counts were preserved."
          exit 1
