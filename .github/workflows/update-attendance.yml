name: Update Punjab District Attendance

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests
      - name: Collect live SIS attendance
        timeout-minutes: 270
        continue-on-error: true
        run: python -u punjab_district_collector.py
      - name: Verify checkpoint or final data exists
        run: |
          python - <<'PY'
          import json, os
          path = 'data/punjab_attendance.json'
          assert os.path.isfile(path) and os.path.getsize(path) > 10, 'No SIS checkpoint was written'
          p = json.load(open(path, encoding='utf-8'))
          assert p.get('level') == 'district_tehsil_markaz_school'
          assert p.get('successful_schools', 0) > 0
          assert isinstance(p.get('districts'), list) and len(p['districts']) >= 20
          print('Valid SIS data:', p.get('successful_schools'), 'schools; districts:', p.get('district_count'))
          PY
      - name: Commit latest real SIS data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/punjab_attendance.json
          if git diff --cached --quiet; then
            echo "No data file changes to commit."
          else
            git commit -m "Update Punjab district attendance data"
            git push
          fi