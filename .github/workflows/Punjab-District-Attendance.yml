name: Punjab SIS Complete Attendance

on:
  workflow_dispatch:
  schedule:
    - cron: "10 3,9,15,21 * * *"
      timezone: Asia/Karachi

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: punjab-sis-attendance
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests
      - name: Collect complete SIS hierarchy
        run: python -u punjab_district_collector.py
      - name: Validate complete hierarchy JSON
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/punjab_attendance.json',encoding='utf-8'))
          assert p.get('level') == 'district_tehsil_markaz_school'
          assert p.get('district_count') == 40, f"Expected 40 districts, got {p.get('district_count')}"
          assert p.get('successful_schools',0) > 0
          assert p.get('complete') is True, 'Attendance collection is incomplete'
          print('PASS:', p['district_count'], 'districts;', p['successful_schools'], 'schools with real SIS attendance')
          PY
      - name: Commit live SIS data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/punjab_attendance.json
          git diff --cached --quiet || git commit -m 'Update complete Punjab SIS attendance'
          git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment
