name: Punjab District Attendance

on:
  workflow_dispatch:
  schedule:
    - cron: '10 3,9,15,21 * * *'
      timezone: 'Asia/Karachi'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: punjab-district-attendance
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests
      - name: Collect Punjab district attendance
        run: python punjab_district_collector.py
      - name: Validate district-only output
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/punjab_district_attendance.json',encoding='utf-8'))
          rows=p.get('districts',[])
          if len(rows)<20: raise SystemExit('Too few districts')
          if p.get('complete_districts') != p.get('district_count'): raise SystemExit('Not all districts complete')
          print('PASS:',len(rows),'districts')
          PY
      - name: Commit data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/punjab_district_attendance.json
          git diff --cached --quiet || git commit -m 'Update Punjab district attendance'
          git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment
