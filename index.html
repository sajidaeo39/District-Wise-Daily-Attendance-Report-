<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Punjab SIS Complete Attendance Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#172033;font:13px Segoe UI,Arial,sans-serif}header{background:#17345f;color:#fff;padding:16px;text-align:center;box-shadow:0 2px 8px #0002}h1{margin:0;font-size:24px}.sub{margin-top:5px;font-size:11px;opacity:.85}.wrap{max-width:1600px;margin:auto;padding:12px}.cards{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}.card{background:#fff;border:1px solid #dbe3ec;border-radius:9px;padding:9px;text-align:center;box-shadow:0 2px 6px #0000000d}.label{font-size:10px;color:#64748b}.num{font-size:19px;font-weight:750;margin-top:4px}.toolbar{display:grid;grid-template-columns:1.5fr repeat(6,1fr);gap:7px;margin:10px 0;background:#fff;padding:9px;border:1px solid #dbe3ec;border-radius:9px}.toolbar>*{height:38px;border:1px solid #cbd5e1;border-radius:6px;padding:0 9px;background:#fff}.toolbar button{background:#0f766e;color:white;border:0;font-weight:650;cursor:pointer}.toolbar .pdf{background:#b42318}.crumb{background:#eaf2fb;border:1px solid #cbdcf0;padding:8px 10px;border-radius:7px;margin-bottom:8px;color:#17345f}.notice{padding:8px;background:#fff4d6;border:1px solid #f0c36d;border-radius:7px;margin:8px 0;color:#704c00}.tablebox{background:#fff;border:1px solid #dbe3ec;border-radius:9px;overflow:auto;max-height:68vh}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:8px 6px;border-bottom:1px solid #e5e7eb;text-align:center;font-size:11px}th{position:sticky;top:0;background:#eaf2fb;color:#17345f;z-index:2}td:first-child,th:first-child{text-align:left}.link{color:#0b5ed7;font-weight:650;cursor:pointer}.good{color:#16803c;font-weight:700}.bad{color:#c62828;font-weight:700}.muted{color:#667085}.footer{text-align:center;padding:12px;color:#667085;font-size:10px}@media(max-width:1000px){.cards{grid-template-columns:repeat(4,1fr)}.toolbar{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){h1{font-size:18px}.wrap{padding:7px}.cards{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.tablebox{max-height:60vh}th,td{font-size:9px;padding:6px}}
</style></head>
<body><header><h1>Punjab SIS Complete Attendance Dashboard</h1><div class="sub">District → Tehsil → Markaz → School • Actual SIS attendance • No synthetic zeros</div></header>
<div class="wrap"><div id="cards" class="cards"></div><div class="toolbar">
<input id="search" placeholder="Search current level..."><select id="district"><option value="">All Districts</option></select><select id="tehsil"><option value="">All Tehsils</option></select><select id="markaz"><option value="">All Markazs</option></select><select id="level"><option value="district">District</option><option value="tehsil">Tehsil</option><option value="markaz">Markaz</option><option value="school">School</option></select>
<button id="back">← Back</button><button id="refresh">↻ Update Live Data</button><button id="excel">⬇ Excel</button><button id="pdf" class="pdf">⬇ PDF</button></div>
<div id="notice" class="notice" style="display:none"></div><div id="crumb" class="crumb">Punjab</div><div class="tablebox"><table><thead id="head"></thead><tbody id="body"></tbody></table></div><div class="footer">Source: Punjab School Information System (SIS) • Data is self-reported by schools in SIS. cite not used here</div></div>
<script>
const DATA='data/punjab_attendance.json';let data=null,view='district',selected={d:'',t:'',m:''},rows=[];
const n=x=>Number(x||0).toLocaleString('en-US'),p=x=>x==null?'—':Number(x||0).toFixed(1)+'%';
function pct(a,b){return b?100*a/b:0}
function summary(rs){let s={schools:rs.length,students:0,sp:0,sa:0,tp:0,ta:0,tm:0};rs.forEach(x=>{s.students+=+x.total_students||0;s.sp+=+x.students_present||0;s.sa+=+x.students_absent||0;if(x.teachers){s.tp+=+x.teachers.present||0;s.ta+=+x.teachers.absent||0;s.tm+=+x.teachers.marked||0}});s.su=Math.max(0,s.students-s.sp-s.sa);s.sr=pct(s.sp,s.students);s.tr=pct(s.tp,s.tp+s.ta);return s}
function schoolRows(){let out=[];(data.districts||[]).forEach(d=>(d.tehsils||[]).forEach(t=>(t.markazs||[]).forEach(m=>(m.schools||[]).forEach(s=>out.push(s)))));return out}
function currentSchools(){let out=schoolRows();if(selected.d)out=out.filter(x=>x.district===selected.d);if(selected.t)out=out.filter(x=>x.tehsil===selected.t);if(selected.m)out=out.filter(x=>x.markaz===selected.m);return out}
function cards(rs){let s=summary(rs);let c=[['Schools',s.schools],['Students',s.students],['Present',s.sp],['Absent',s.sa],['Unmarked',s.su],['Student %',p(s.sr)],['Teacher Present',s.tp],['Teacher %',p(s.tr)]];document.getElementById('cards').innerHTML=c.map(x=>'<div class="card"><div class="label">'+x[0]+'</div><div class="num">'+(typeof x[1]==='number'?n(x[1]):x[1])+'</div></div>').join('')}
function aggregateGroups(groups,nameKey,idKey){return groups.map(g=>{let rs=[];(g.tehsils||[]).forEach(t=>(t.markazs||[]).forEach(m=>(m.schools||[]).forEach(s=>rs.push(s))));let s=summary(rs);return {name:g[nameKey],id:g[idKey],...s}})}
function getRows(){
 let out=[];
 if(view==='district') out=(data.districts||[]).map(d=>{let rs=[];(d.tehsils||[]).forEach(t=>(t.markazs||[]).forEach(m=>(m.schools||[]).forEach(s=>rs.push(s))));return {name:d.district,id:d.district_id,...summary(rs),type:'district'}});
 if(view==='tehsil'){let d=(data.districts||[]).find(x=>x.district===selected.d);out=d?(d.tehsils||[]).map(t=>{let rs=[];(t.markazs||[]).forEach(m=>(m.schools||[]).forEach(s=>rs.push(s)));return {name:t.tehsil,id:t.tehsil_id,...summary(rs),type:'tehsil'}):[]}
 if(view==='markaz'){let d=(data.districts||[]).find(x=>x.district===selected.d);let t=d&&(d.tehsils||[]).find(x=>x.tehsil===selected.t);out=t?(t.markazs||[]).map(m=>({name:m.markaz,id:m.markaz_id,...summary(m.schools||[]),type:'markaz'})):[]}
 if(view==='school') out=currentSchools().map(s=>({name:s.school,id:s.emis,...s,type:'school'}));
 let q=document.getElementById('search').value.toLowerCase().trim();return q?out.filter(x=>String(x.name||'').toLowerCase().includes(q)):out}
function render(){
 rows=getRows();let h=view==='school'?['School / EMIS','Students','Present','Absent','Unmarked','Student %','Teachers Present','Teachers Absent','Teacher %','Status']:['Name','Schools','Students','Present','Absent','Unmarked','Student %','Teachers Present','Teachers Absent','Teacher %'];
 document.getElementById('head').innerHTML='<tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr>';
 document.getElementById('body').innerHTML=rows.length?rows.map(x=>{let tr=x.tr,sr=x.sr;return '<tr><td class="link" data-name="'+String(x.name).replace(/"/g,'&quot;')+'">'+x.name+(view==='school'?'<br><span class="muted">'+x.id+'</span>':'')+'</td>'+ (view==='school'?'<td>'+n(x.total_students)+'</td><td>'+n(x.students_present)+'</td><td>'+n(x.students_absent)+'</td><td>'+n(x.students_unmarked)+'</td><td class="'+(sr>=90?'good':sr<70?'bad':'')+'">'+p(sr)+'</td><td>'+n(x.teachers?.present)+'</td><td>'+n(x.teachers?.absent)+'</td><td>'+p(x.teachers?(pct(x.teachers.present,x.teachers.present+x.teachers.absent)):null)+'</td><td>'+x.attendance_status+'</td>':'<td>'+n(x.schools)+'</td><td>'+n(x.students)+'</td><td>'+n(x.sp)+'</td><td>'+n(x.sa)+'</td><td>'+n(x.su)+'</td><td class="'+(sr>=90?'good':sr<70?'bad':'')+'">'+p(sr)+'</td><td>'+n(x.tp)+'</td><td>'+n(x.ta)+'</td><td class="'+(tr>=90?'good':tr<70?'bad':'')+'">'+p(tr)+'</td>')+'</tr>'}).join(''):'<tr><td colspan="10" class="muted">No data at this level.</td></tr>';
 document.querySelectorAll('.link').forEach(el=>el.onclick=()=>drill(el.dataset.name));cards(currentSchools());crumb();
}
function crumb(){let a=['Punjab'];if(selected.d)a.push(selected.d);if(selected.t)a.push(selected.t);if(selected.m)a.push(selected.m);if(view==='school')a.push('Schools');document.getElementById('crumb').textContent=a.join('  ›  ')}
function drill(name){if(view==='district'){selected.d=name;view='tehsil';}else if(view==='tehsil'){selected.t=name;view='markaz';}else if(view==='markaz'){selected.m=name;view='school';}render();populate()}
function populate(){let D=data.districts||[];let ds=document.getElementById('district');ds.innerHTML='<option value="">All Districts</option>'+D.map(d=>'<option>'+d.district+'</option>').join('');ds.value=selected.d||'';let d=D.find(x=>x.district===selected.d);let ts=d?.tehsils||[];let tsel=document.getElementById('tehsil');tsel.innerHTML='<option value="">All Tehsils</option>'+ts.map(t=>'<option>'+t.tehsil+'</option>').join('');tsel.value=selected.t||'';let t=ts.find(x=>x.tehsil===selected.t);let ms=t?.markazs||[];let msel=document.getElementById('markaz');msel.innerHTML='<option value="">All Markazs</option>'+ms.map(m=>'<option>'+m.markaz+'</option>').join('');msel.value=selected.m||''}
async function load(){let r=await fetch(DATA+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();let z=document.getElementById('notice');z.style.display=data.complete?'none':'block';z.textContent='⚠️ SIS data is incomplete: '+data.successful_schools+'/'+data.inventory_schools+' schools returned attendance. Failed requests are not converted to fake zeros.';if(data.complete)z.style.display='none';populate();render()}
function excel(){let h=['Level','Name','Schools','Students','Present','Absent','Unmarked','Student %','Teacher Present','Teacher Absent','Teacher %'];let d=rows.map(x=>[view,x.name,x.schools||1,x.students||x.total_students,x.sp||x.students_present,x.sa||x.students_absent,x.su||x.students_unmarked,x.sr||x.student_attendance_pct,x.tp||x.teachers?.present||0,x.ta||x.teachers?.absent||0,x.tr||null]);let ws=XLSX.utils.aoa_to_sheet([h,...d]);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Attendance');XLSX.writeFile(wb,'Punjab_SIS_Attendance_'+view+'_'+new Date().toISOString().slice(0,10)+'.xlsx')}
function pdf(){const {jsPDF}=window.jspdf;let doc=new jsPDF({orientation:'landscape',unit:'pt',format:'a4'});doc.text('Punjab SIS Complete Attendance - '+view.toUpperCase(),420,30,{align:'center'});doc.autoTable({head:[['Name','Schools','Students','Present','Absent','Unmarked','Student %','Teacher Present','Teacher Absent','Teacher %']],body:rows.map(x=>[x.name,x.schools||1,n(x.students||x.total_students),n(x.sp||x.students_present),n(x.sa||x.students_absent),n(x.su||x.students_unmarked),p(x.sr||x.student_attendance_pct),n(x.tp||x.teachers?.present),n(x.ta||x.teachers?.absent),p(x.tr||x.teacher_attendance_pct)]),startY:50,styles:{fontSize:7}});doc.save('Punjab_SIS_Attendance_'+view+'.pdf')}
document.getElementById('search').oninput=render;document.getElementById('district').onchange=e=>{selected.d=e.target.value;selected.t='';selected.m='';view=e.target.value?'tehsil':'district';populate();render()};document.getElementById('tehsil').onchange=e=>{selected.t=e.target.value;selected.m='';view=e.target.value?'markaz':'tehsil';populate();render()};document.getElementById('markaz').onchange=e=>{selected.m=e.target.value;view=e.target.value?'school':'markaz';render()};document.getElementById('level').onchange=e=>{view=e.target.value;render()};document.getElementById('back').onclick=()=>{if(view==='school'){selected.m='';view='markaz'}else if(view==='markaz'){selected.t='';view='tehsil'}else if(view==='tehsil'){selected.d='';view='district'}populate();render()};document.getElementById('refresh').onclick=()=>load().catch(e=>alert(e.message));document.getElementById('excel').onclick=excel;document.getElementById('pdf').onclick=pdf;load().catch(e=>document.getElementById('notice').textContent='Live data not available: '+e.message);
</script></body></html>
